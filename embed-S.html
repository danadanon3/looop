<!-- =====================================================================
  ВРАЩАЮЩАЯСЯ ВИЛЛА — HTML-элемент для Zero Block (Тильда)
  Вставить целиком в элемент «HTML» внутри Zero Block.
  Ссылка на модель уже вставлена.
===================================================================== -->

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  /* Модель занимает весь HTML-элемент и «не ловит» мышь/тач:
     курсор проходит сквозь, кнопки и текст рядом кликаются свободно */
  #villa-hero{
    position:absolute; inset:0; width:100%; height:100%;
    background:transparent; --poster-color:transparent;
    pointer-events:none;
    opacity:0; transition:opacity .9s ease;   /* плавное появление после загрузки */
  }
  #villa-hero.is-ready{ opacity:1; }
  @media (max-width:640px){ #villa-hero{ top:-7%; } }   /* телефон: модель выше */
  /* Если HTML-слой лежит НАД кнопками, этот пункт тоже отдаёт клики вниз */
  .t396__elem:has(#villa-hero), .tn-atom:has(#villa-hero){ pointer-events:none !important; }
</style>

<model-viewer
  id="villa-hero"
  alt="Villa — Domaine d'Eole"

  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="12deg"

  camera-orbit="35deg 45deg 78%"
  field-of-view="30deg"
  interaction-prompt="none"
  disable-zoom disable-pan disable-tap

  environment-image="legacy"
  exposure="1.0"
  shadow-intensity="1.1"
  shadow-softness="1"

  loading="eager"
  poster=""
  reveal="auto">
</model-viewer>

<script>
(function () {
  var mv = document.getElementById('villa-hero');
  if (!mv) return;

  /* максимальная чёткость: не снижать разрешение рендера на слабых устройствах */
  customElements.whenDefined('model-viewer').then(function () {
    var MV = customElements.get('model-viewer');
    if (MV) MV.minimumRenderScale = 1;
  });

  /* модель с готовыми материалами (штукатурка, камень, дерево, стекло, вода) — цвета не трогаем */
  mv.addEventListener('load', function () { mv.classList.add('is-ready'); });

  /* телефон: облегчённая модель (быстрее грузится) и камера поближе — вилла крупнее */
  var mobile = window.matchMedia('(max-width: 640px)').matches;
  mv.setAttribute('src', mobile
    ? 'https://cdn.jsdelivr.net/gh/danadanon3/villaS-3d@main/villa-S-hq-mobile.glb'
    : 'https://cdn.jsdelivr.net/gh/danadanon3/villaS-3d@main/villa-S-hq.glb');
  if (mobile) mv.setAttribute('camera-orbit', '35deg 44deg 98%');
})();
</script>
